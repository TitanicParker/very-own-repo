<style>
:root{--bg:#090b0a;--bg2:#0d100e;--ink:#f0f3f1;--body:#c9cfcb;--muted:#7f8983;--line:rgba(220,230,223,.14);--green:#91efb9;--red:#c96b76;--wide:760px;--wide-reader:720px}*{box-sizing:border-box}html{background:var(--bg);color:var(--body)}html,body{margin:0;min-height:100%;background:var(--bg);font-family:Georgia,'Times New Roman',serif}body{background:radial-gradient(72rem 46rem at 8% -12%,rgba(145,239,185,.055),transparent 58%),radial-gradient(46rem 32rem at 105% 16%,rgba(201,107,118,.035),transparent 64%),linear-gradient(180deg,var(--bg2),var(--bg) 42rem);color:var(--body)}a,button,input,select{font:inherit}.shell{width:min(calc(100% - 2.5rem),var(--wide));margin:auto;padding:4.2rem 0 7rem}.top{display:flex;justify-content:space-between;align-items:center;gap:1rem;margin-bottom:4rem;font:500 .68rem/1.3 system-ui,sans-serif;letter-spacing:.08em;text-transform:uppercase}.top-left,.top-right{display:flex;align-items:center;gap:1rem;flex-wrap:wrap}.top a,.top button{appearance:none;border:0;background:none;padding:0;color:var(--muted);text-decoration:none;cursor:pointer}.top a:hover,.top button:hover{color:var(--green)}.kicker{margin:0 0 1rem;color:var(--green);font:600 .68rem/1 system-ui,sans-serif;letter-spacing:.13em;text-transform:uppercase}h1{margin:0 0 1.25rem;color:var(--ink);font-size:clamp(3.1rem,10vw,5.7rem);line-height:.94;font-weight:400;letter-spacing:-.05em}h1.long{font-size:clamp(2.25rem,7vw,4.25rem);line-height:1}.lede{max-width:690px;margin:0 0 2.2rem;font-size:clamp(1.12rem,2.8vw,1.36rem);line-height:1.56}.quiet{color:var(--muted)}.source-note{margin:2rem 0 0;padding:1.15rem 0;border-top:1px solid var(--line);font:500 .8rem/1.55 system-ui,sans-serif;color:var(--muted)}.source-note a{color:var(--body);text-decoration:none;border-bottom:1px solid var(--line)}.source-note a:hover{color:var(--green)}.portals{display:grid;grid-template-columns:1fr 1fr;gap:1rem;margin-top:2.3rem}.portal{display:block;min-height:13rem;padding:1.35rem;border:1px solid var(--line);border-radius:18px;background:rgba(255,255,255,.015);text-decoration:none}.portal:hover{border-color:rgba(145,239,185,.45)}.portal .no{display:block;margin-bottom:1.6rem;color:var(--green);font:600 .68rem/1 system-ui,sans-serif;letter-spacing:.11em;text-transform:uppercase}.portal strong{display:block;color:var(--ink);font-size:clamp(1.6rem,4vw,2.15rem);font-weight:400;line-height:1.08}.portal span:last-child{display:block;margin-top:.8rem;color:var(--muted);font:500 .8rem/1.5 system-ui,sans-serif}.list{margin-top:2.6rem;border-top:1px solid var(--line)}.item{display:grid;grid-template-columns:4.3rem 1fr auto;gap:1rem;align-items:start;padding:1rem 0;border-bottom:1px solid rgba(220,230,223,.09);text-decoration:none}.item:hover .item-title{color:var(--green)}.item-no{color:var(--green);font:600 .68rem/1.6 system-ui,sans-serif;letter-spacing:.08em}.item-title{color:var(--ink);font-size:clamp(1.06rem,2.5vw,1.25rem);line-height:1.35}.item-meta{margin-top:.28rem;color:var(--muted);font:500 .74rem/1.45 system-ui,sans-serif}.item-kind{color:var(--muted);font:500 .7rem/1.5 system-ui,sans-serif;text-align:right;max-width:9rem}.controls{display:flex;gap:.75rem;align-items:center;flex-wrap:wrap;margin:1.6rem 0 0}.search{flex:1 1 16rem;min-width:0;border:1px solid var(--line);border-radius:12px;background:rgba(255,255,255,.018);color:var(--ink);padding:.8rem .9rem;outline:none;font:500 .85rem/1.2 system-ui,sans-serif}.search:focus{border-color:rgba(145,239,185,.5)}.range{appearance:none;border:1px solid var(--line);border-radius:12px;background:#0d100e;color:var(--body);padding:.76rem .9rem;outline:none;font:500 .8rem/1.2 system-ui,sans-serif}.count{margin-top:.75rem;color:var(--muted);font:500 .72rem/1.4 system-ui,sans-serif}.loading{padding:6rem 0;color:var(--muted);font-size:1.1rem}.error{max-width:650px;padding:1.2rem 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);font-size:1.1rem;line-height:1.6}.error a{color:var(--green)}
.reader-mode{width:100%;height:100svh;overflow:hidden}.reader-mode .shell{display:none}.reader-top{position:fixed;z-index:20;left:max(1.15rem,env(safe-area-inset-left));right:max(1.15rem,env(safe-area-inset-right));top:max(1.1rem,env(safe-area-inset-top));display:flex;justify-content:space-between;gap:1rem;pointer-events:none;font:500 .66rem/1 system-ui,sans-serif;letter-spacing:.08em}.reader-top .links{display:flex;gap:.85rem;pointer-events:auto}.reader-top a{color:var(--muted);text-decoration:none}.reader-top a:hover{color:var(--green)}.reader-progress{color:var(--muted);white-space:nowrap}.reader-progress .live{color:var(--green)}.deck{display:flex;width:100%;height:100svh;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;scroll-behavior:smooth;overscroll-behavior-x:contain;scrollbar-width:none;-webkit-overflow-scrolling:touch}.deck::-webkit-scrollbar{display:none}.gulp{flex:0 0 100%;width:100%;height:100svh;scroll-snap-align:start;scroll-snap-stop:always;overflow-y:auto;display:flex;align-items:center;justify-content:center;padding:max(4.5rem,calc(env(safe-area-inset-top) + 3.5rem)) max(1.35rem,env(safe-area-inset-right)) max(5rem,calc(env(safe-area-inset-bottom) + 4rem)) max(1.35rem,env(safe-area-inset-left));scrollbar-width:none}.gulp::-webkit-scrollbar{display:none}.inner{width:min(100%,var(--wide-reader));margin:auto}.eyebrow{margin:0 0 1rem;color:var(--green);font:600 .68rem/1 system-ui,sans-serif;letter-spacing:.13em;text-transform:uppercase}.gulp h1{margin:0 0 1.5rem;color:var(--ink);font-size:clamp(2.8rem,9vw,5rem);line-height:.95;font-weight:400;letter-spacing:-.045em}.gulp h1.long{font-size:clamp(2.1rem,6.8vw,3.9rem);line-height:1}.gulp p{max-width:690px;margin:0 0 1.25rem;font-size:clamp(1.08rem,2.65vw,1.34rem);line-height:1.56}.gulp p:last-child{margin-bottom:0}.emphasis{color:var(--ink);font-size:clamp(1.42rem,3.8vw,1.92rem)!important;line-height:1.42!important}.source-lines,.derivation{list-style:none;margin:0;padding:0}.source-lines li,.derivation li{display:grid;grid-template-columns:3.6rem 1fr;gap:.85rem;padding:.54rem 0;border-top:1px solid rgba(220,230,223,.08);font-size:clamp(1rem,2.35vw,1.2rem);line-height:1.52}.source-lines li:first-child,.derivation li:first-child{border-top:0}.line-no{color:var(--green);font:600 .65rem/1.8 system-ui,sans-serif;letter-spacing:.04em}.cue{position:fixed;z-index:20;left:50%;bottom:max(1.1rem,env(safe-area-inset-bottom));transform:translateX(-50%);display:flex;align-items:center;gap:.65rem;color:var(--green);font:600 .68rem/1 system-ui,sans-serif;letter-spacing:.13em;text-transform:uppercase;white-space:nowrap;text-shadow:0 0 20px rgba(145,239,185,.16);pointer-events:none}.cue::after{content:'→';font-size:1rem;font-weight:400}.cue.action{pointer-events:auto;cursor:pointer}.cue.action:hover{filter:brightness(1.18)}
@media(max-width:640px){.shell{padding-top:3.6rem}.top{margin-bottom:3rem}.portals{grid-template-columns:1fr}.portal{min-height:10rem}.item{grid-template-columns:3rem 1fr}.item-kind{grid-column:2;text-align:left;max-width:none;margin-top:-.55rem}.reader-top{font-size:.6rem}.gulp{align-items:flex-start;padding-top:max(4.8rem,calc(env(safe-area-inset-top) + 3.8rem))}.gulp h1{font-size:3rem}.gulp h1.long{font-size:2.35rem}.gulp p{font-size:1.07rem;line-height:1.5}.source-lines li,.derivation li{grid-template-columns:3rem 1fr;font-size:1.02rem;line-height:1.48}}@media(max-height:700px) and (max-width:640px){.gulp{padding-top:max(4rem,calc(env(safe-area-inset-top) + 3rem))}.gulp p{font-size:1rem}.source-lines li,.derivation li{font-size:.96rem;padding:.4rem 0}}@media(prefers-reduced-motion:reduce){.deck{scroll-behavior:auto}}@view-transition{navigation:auto}
</style>
</head>
<body>
<div id="app"><main class="shell"><p class="loading">Opening the testing field…</p></main></div>
<script>
const SOURCE_URL='../TESTING_FIELD.md';
const GITHUB_SOURCE='https://github.com/TitanicParker/very-own-repo/blob/main/TESTING_FIELD.md';
const app=document.getElementById('app');
let field=null;

function esc(value){return String(value).replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[ch]))}
function words(value){return String(value).trim().split(/\s+/).filter(Boolean).length}
function parseField(text){
  const fairyStart=text.indexOf('# Corpus I — The 27 Fairy Tales');
  const mathStart=text.indexOf('# Corpus II — The 615 Recoverable Traversals');
  if(fairyStart<0||mathStart<0)throw new Error('The canonical corpus headings could not be found.');
  const fairyText=text.slice(fairyStart,mathStart);
  const mathText=text.slice(mathStart);
  const taleHeads=[...fairyText.matchAll(/^##\s+(.+)$/gm)];
  const tales=taleHeads.map((match,index)=>{
    const bodyStart=match.index+match[0].length;
    const bodyEnd=index+1<taleHeads.length?taleHeads[index+1].index:fairyText.length;
    const body=fairyText.slice(bodyStart,bodyEnd);
    const sentences=body.split('\n').map(line=>line.match(/^(\d+)\.\s+(.+)$/)).filter(Boolean).map(m=>({number:Number(m[1]),text:m[2]})).filter(s=>s.number>=100);
    return {title:match[1].trim(),sentences};
  }).filter(t=>t.sentences.length);
  const traversalHeads=[...mathText.matchAll(/^##\s+Traversal\s+(\d{3})\s+—\s+(.+?)\s+—\s+(.+)$/gm)];
  const traversals=traversalHeads.map((match,index)=>{
    const bodyStart=match.index+match[0].length;
    const bodyEnd=index+1<traversalHeads.length?traversalHeads[index+1].index:mathText.length;
    const body=mathText.slice(bodyStart,bodyEnd);
    const claimMatch=body.match(/\*\*Claim\*\*\s*\n+([\s\S]*?)\n+\*\*Derivation\*\*/);
    const derivationPart=body.split('**Derivation**')[1]||'';
    const steps=derivationPart.split('\n').map(line=>line.match(/^(\d+)\.\s+(.+)$/)).filter(Boolean).map(m=>({number:Number(m[1]),text:m[2]}));
    return {number:Number(match[1]),kind:match[2].trim(),title:match[3].trim(),claim:claimMatch?claimMatch[1].trim():'',steps};
  });
  return {tales,traversals};
}
function topNav(extra=''){
  return `<nav class="top"><div class="top-left"><a href="#">Testing Field</a><a href="../book.html">Episodes</a></div><div class="top-right">${extra}<a href="${GITHUB_SOURCE}">Source on GitHub</a></div></nav>`;
}
function integrityLine(){
  const taleCount=field.tales.length, traversalCount=field.traversals.length;
  const ok=taleCount===27&&traversalCount===615;
  return `<p class="source-note">${ok?'This interface renders the canonical <code>TESTING_FIELD.md</code> directly. It does not rewrite the corpus.':'Source check: '+taleCount+' tales and '+traversalCount+' traversals were recovered from the canonical file.'} <a href="${SOURCE_URL}">Open the raw source</a>.</p>`;
}
function renderHome(){
  document.body.classList.remove('reader-mode');
  document.title='Testing Field — Meaning Is Not Everything';
  app.innerHTML=`<main class="shell">${topNav()}<p class="kicker">Reference field</p><h1>The Testing Field</h1><p class="lede">The material behind Episode Five, kept outside the episode sequence but available in the same reading world. Source wording and source order remain untouched.</p><div class="portals"><a class="portal" href="#fairy"><span class="no">Corpus I</span><strong>27 Fairy Tales</strong><span>1,883 source sentences in narrative order. Open any tale as its own swipeable reading.</span></a><a class="portal" href="#math"><span class="no">Corpus II</span><strong>615 Mathematical Traversals</strong><span>Each recoverable traversal opens as a two-screen claim-and-derivation record.</span></a></div>${integrityLine()}</main>`;
}
function taleHref(index){return `#fairy/${String(index+1).padStart(2,'0')}`}
function mathHref(number){return `#math/${String(number).padStart(3,'0')}`}
function renderFairyIndex(){
  document.body.classList.remove('reader-mode');
  document.title='27 Fairy Tales — Testing Field';
  const rows=field.tales.map((tale,index)=>{const first=tale.sentences[0],last=tale.sentences[tale.sentences.length-1];return `<a class="item" href="${taleHref(index)}"><span class="item-no">${String(index+1).padStart(2,'0')}</span><span><span class="item-title">${esc(tale.title)}</span><span class="item-meta">${tale.sentences.length} sentences · source ${first.number}–${last.number}</span></span><span class="item-kind">Fairy tale</span></a>`}).join('');
  app.innerHTML=`<main class="shell">${topNav()}<p class="kicker">Corpus I</p><h1>The 27 Fairy Tales</h1><p class="lede">Each tale is separated cleanly from the corpus and read in its original sentence order. Nothing has been paraphrased, repaired or classified here.</p><div class="list">${rows}</div>${integrityLine()}</main>`;
}
function renderMathIndex(){
  document.body.classList.remove('reader-mode');
  document.title='615 Mathematical Traversals — Testing Field';
  app.innerHTML=`<main class="shell">${topNav()}<p class="kicker">Corpus II</p><h1>615 Mathematical Traversals</h1><p class="lede">The recoverable mathematical corpus in source order. Open a traversal to see its claim first and its complete derivation second.</p><div class="controls"><input id="mathSearch" class="search" type="search" placeholder="Search title, claim or source label" aria-label="Search traversals"><select id="mathRange" class="range" aria-label="Traversal range"></select></div><p id="mathCount" class="count"></p><div id="mathList" class="list"></div>${integrityLine()}</main>`;
  const range=document.getElementById('mathRange');
  const groups=[];for(let start=1;start<=field.traversals.length;start+=100){groups.push([start,Math.min(start+99,field.traversals.length)])}
  range.innerHTML=groups.map(([a,b],i)=>`<option value="${i}">${String(a).padStart(3,'0')}–${String(b).padStart(3,'0')}</option>`).join('');
  const search=document.getElementById('mathSearch');
  function update(){
    const q=search.value.trim().toLowerCase();
    const [a,b]=groups[Number(range.value)||0];
    const rows=(q?field.traversals:field.traversals.filter(t=>t.number>=a&&t.number<=b)).filter(t=>!q||`${t.number} ${t.kind} ${t.title} ${t.claim}`.toLowerCase().includes(q));
    document.getElementById('mathCount').textContent=q?`${rows.length} matching traversals`:`Traversals ${String(a).padStart(3,'0')}–${String(b).padStart(3,'0')}`;
    document.getElementById('mathList').innerHTML=rows.map(t=>`<a class="item" href="${mathHref(t.number)}"><span class="item-no">${String(t.number).padStart(3,'0')}</span><span><span class="item-title">${esc(t.title)}</span><span class="item-meta">${esc(t.claim)}</span></span><span class="item-kind">${esc(t.kind)}</span></a>`).join('')||'<p class="quiet">No traversals match that search.</p>';
  }
  range.addEventListener('change',update);search.addEventListener('input',update);update();
}
function chunkTale(sentences){
  const chunks=[];let current=[];let count=0;
  sentences.forEach(sentence=>{const w=words(sentence.text);if(current.length&&(count+w>190||current.length>=11)){chunks.push(current);current=[];count=0}current.push(sentence);count+=w});
  if(current.length)chunks.push(current);return chunks;
}
function sourceList(lines,derivation=false){return `<ol class="${derivation?'derivation':'source-lines'}">${lines.map(line=>`<li><span class="line-no">${line.number}</span><span>${esc(line.text)}</span></li>`).join('')}</ol>`}
function renderReader(slides,context){
  document.body.classList.add('reader-mode');
  app.innerHTML=`<div class="reader-top"><div class="links"><a href="${context.indexHref}">${esc(context.indexLabel)}</a><a href="../book.html">Episodes</a><a href="${GITHUB_SOURCE}">Source</a></div><div id="readerProgress" class="reader-progress"></div></div><main id="deck" class="deck" aria-label="${esc(context.aria)}">${slides.join('')}</main><div id="cue" class="cue">Swipe for more</div>`;
  const deck=document.getElementById('deck'),slideEls=[...deck.querySelectorAll('.gulp')],progress=document.getElementById('readerProgress'),cue=document.getElementById('cue');let index=0,touchX=null,touchY=null,wheelCarry=0,wheelReset=null;
  function update(){index=Math.max(0,Math.min(slideEls.length-1,Math.round(deck.scrollLeft/Math.max(1,deck.clientWidth))));progress.innerHTML=`${esc(context.position)} · <span class="live">${index+1}</span> / ${slideEls.length}`;const last=index===slideEls.length-1;cue.textContent=last?context.nextLabel:'Swipe for more';cue.classList.toggle('action',last);}
  function nextItem(){if(context.nextHref)location.hash=context.nextHref.replace(/^#/,'');else location.hash='';}
  function prevItem(){if(context.prevHref)location.hash=context.prevHref.replace(/^#/,'');}
  function forward(){if(index<slideEls.length-1)deck.scrollTo({left:(index+1)*deck.clientWidth,behavior:'smooth'});else nextItem()}
  function back(){if(index>0)deck.scrollTo({left:(index-1)*deck.clientWidth,behavior:'smooth'});else if(context.prevHref)prevItem()}
  deck.addEventListener('scroll',()=>requestAnimationFrame(update),{passive:true});
  deck.addEventListener('touchstart',e=>{const t=e.changedTouches[0];touchX=t.clientX;touchY=t.clientY},{passive:true});
  deck.addEventListener('touchend',e=>{if(touchX===null)return;const t=e.changedTouches[0],dx=t.clientX-touchX,dy=t.clientY-touchY;if(Math.abs(dx)>46&&Math.abs(dx)>Math.abs(dy)*1.15){if(dx<0&&index===slideEls.length-1)nextItem();if(dx>0&&index===0&&context.prevHref)prevItem()}touchX=touchY=null},{passive:true});
  deck.addEventListener('wheel',e=>{if(index!==slideEls.length-1)return;const forwardDelta=Math.max(e.deltaX,e.deltaY);if(forwardDelta<=0)return;wheelCarry+=forwardDelta;clearTimeout(wheelReset);wheelReset=setTimeout(()=>wheelCarry=0,450);if(wheelCarry>115){wheelCarry=0;nextItem()}},{passive:true});
  document.onkeydown=e=>{if(e.key==='ArrowRight'||e.key==='PageDown'||e.key===' '){e.preventDefault();forward()}if(e.key==='ArrowLeft'||e.key==='PageUp'){e.preventDefault();back()}};
  cue.addEventListener('click',()=>{if(index===slideEls.length-1)nextItem()});update();
}
function renderFairyDetail(index){
  const tale=field.tales[index];if(!tale){location.hash='fairy';return}
  document.title=`${tale.title} — Testing Field`;
  const chunks=chunkTale(tale.sentences),first=tale.sentences[0],last=tale.sentences[tale.sentences.length-1];
  const slides=[`<section class="gulp"><div class="inner"><p class="eyebrow">Fairy tale ${String(index+1).padStart(2,'0')} of 27</p><h1${tale.title.length>28?' class="long"':''}>${esc(tale.title)}</h1><p class="emphasis">${tale.sentences.length} source sentences.</p><p>Read in the exact order preserved in the testing field.</p><p class="quiet">Source sentence range ${first.number}–${last.number}.</p></div></section>`].concat(chunks.map(chunk=>`<section class="gulp"><div class="inner">${sourceList(chunk)}</div></section>`));
  const next=index+1<field.tales.length?taleHref(index+1):'#';const prev=index>0?taleHref(index-1):null;
  renderReader(slides,{indexHref:'#fairy',indexLabel:'All tales',aria:tale.title,position:`Tale ${String(index+1).padStart(2,'0')} / 27`,nextHref:next,prevHref:prev,nextLabel:index+1<field.tales.length?'Next tale':'Field index'});
}
function renderMathDetail(number){
  const index=number-1,traversal=field.traversals[index];if(!traversal||traversal.number!==number){location.hash='math';return}
  document.title=`Traversal ${String(number).padStart(3,'0')} — Testing Field`;
  const slides=[`<section class="gulp"><div class="inner"><p class="eyebrow">Traversal ${String(number).padStart(3,'0')} of 615</p><h1 class="long">${esc(traversal.title)}</h1><p class="quiet">${esc(traversal.kind)}</p><p class="emphasis">Claim</p><p>${esc(traversal.claim)}</p></div></section>`,`<section class="gulp"><div class="inner"><p class="eyebrow">Derivation</p>${sourceList(traversal.steps,true)}<p class="quiet">Source wording and order preserved.</p></div></section>`];
  const next=number<field.traversals.length?mathHref(number+1):'#';const prev=number>1?mathHref(number-1):null;
  renderReader(slides,{indexHref:'#math',indexLabel:'All traversals',aria:`Traversal ${number}`,position:`Traversal ${String(number).padStart(3,'0')} / 615`,nextHref:next,prevHref:prev,nextLabel:number<field.traversals.length?'Next traversal':'Field index'});
}
function route(){
  document.onkeydown=null;
  const hash=decodeURIComponent(location.hash.replace(/^#/,'')).replace(/^\//,'');
  if(!hash){renderHome();return}
  if(hash==='fairy'){renderFairyIndex();return}
  if(hash==='math'){renderMathIndex();return}
  let m=hash.match(/^fairy\/(\d{1,2})/);if(m){renderFairyDetail(Number(m[1])-1);return}
  m=hash.match(/^math\/(\d{1,3})/);if(m){renderMathDetail(Number(m[1]));return}
  renderHome();
}
async function start(){
  try{const response=await fetch(SOURCE_URL);if(!response.ok)throw new Error(`Source returned ${response.status}`);field=parseField(await response.text());route()}catch(error){document.body.classList.remove('reader-mode');app.innerHTML=`<main class="shell">${topNav()}<p class="kicker">Reference field</p><h1>Source unavailable.</h1><div class="error"><p>The branded reader could not load the canonical testing field.</p><p><a href="${SOURCE_URL}">Open TESTING_FIELD.md directly</a> or <a href="${GITHUB_SOURCE}">view it on GitHub</a>.</p><p class="quiet">${esc(error.message)}</p></div></main>`}}
window.addEventListener('hashchange',()=>{if(field)route()});
if('serviceWorker'in navigator)navigator.serviceWorker.register('../service-worker.js').catch(()=>{});
start();
</script>
