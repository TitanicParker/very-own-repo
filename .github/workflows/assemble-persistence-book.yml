name: Assemble Persistence book

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/assemble-persistence-book.yml'

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Assemble appendices
        shell: bash
        run: |
          set -euo pipefail
          python3 -c "from pathlib import Path; p=Path('WORKING.md'); s=p.read_text(); marker='# Appendix — The 54'; head=s.split(marker,1)[0].rstrip(); defs=Path('APPENDIX.md').read_text().strip(); table=Path('CANONICAL_54.md').read_text().strip(); p.write_text(head+'\n\n---\n\n'+defs+'\n\n---\n\n'+table+'\n')"
      - name: Commit assembled book
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add WORKING.md
          git commit -m 'Assemble canonical Persistence appendices into book'
          git push
