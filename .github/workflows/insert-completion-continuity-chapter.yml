name: Insert completion continuity chapter

on:
  push:
    paths:
      - '.github/workflows/insert-completion-continuity-chapter.yml'

permissions:
  contents: write

jobs:
  update-sequence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Update reader route and chapter numbers
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('assets/reader-marker.js')
          s = p.read_text()
          s = s.replace("'004-the-whole-field.html': '005-the-testing-field.html',\n    '005-the-testing-field.html': '003-enough-has-a-direction.html',", "'004-the-whole-field.html': '005-the-testing-field.html',\n    '005-the-testing-field.html': '006-completion-makes-continuation-possible.html',\n    '006-completion-makes-continuation-possible.html': '003-enough-has-a-direction.html',")
          if "'005-the-testing-field.html': '006-completion-makes-continuation-possible.html'" not in s:
              s = s.replace("'004-the-whole-field.html': '005-the-testing-field.html',", "'004-the-whole-field.html': '005-the-testing-field.html',\n    '005-the-testing-field.html': '006-completion-makes-continuation-possible.html',\n    '006-completion-makes-continuation-possible.html': '003-enough-has-a-direction.html',")
          p.write_text(s)

          p = Path('posts/003-enough-has-a-direction.html')
          s = p.read_text()
          s = s.replace('Chapter Five.', 'Chapter Seven.')
          s = s.replace('aria-label="Chapter Five"', 'aria-label="Chapter Seven"')
          s = s.replace('<p class="eyebrow">Chapter Five</p>', '<p class="eyebrow">Chapter Seven</p>')
          s = s.replace('<a href="004-the-whole-field.html">Chapter Four</a>', '<a href="006-completion-makes-continuation-possible.html">Chapter Six</a>')
          p.write_text(s)

          p = Path('posts/004-what-survives-the-grasp.html')
          s = p.read_text()
          s = s.replace('Chapter Six.', 'Chapter Eight.')
          s = s.replace('aria-label="Chapter Six"', 'aria-label="Chapter Eight"')
          s = s.replace('<p class="eyebrow">Chapter Six</p>', '<p class="eyebrow">Chapter Eight</p>')
          s = s.replace('<a href="003-enough-has-a-direction.html">Chapter Five</a>', '<a href="003-enough-has-a-direction.html">Chapter Seven</a>')
          p.write_text(s)

          p = Path('posts/005-enough-has-to-survive-contact.html')
          s = p.read_text()
          s = s.replace('Chapter Seven.', 'Chapter Nine.')
          s = s.replace('aria-label="Chapter Seven"', 'aria-label="Chapter Nine"')
          s = s.replace('<p class="eyebrow">Chapter Seven</p>', '<p class="eyebrow">Chapter Nine</p>')
          s = s.replace('<a href="004-what-survives-the-grasp.html">Chapter Six</a>', '<a href="004-what-survives-the-grasp.html">Chapter Eight</a>')
          p.write_text(s)
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/reader-marker.js posts/003-enough-has-a-direction.html posts/004-what-survives-the-grasp.html posts/005-enough-has-to-survive-contact.html
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Route reader through completion continuity chapter"
          git push origin main
