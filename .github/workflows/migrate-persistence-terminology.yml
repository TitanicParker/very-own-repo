name: Migrate Persistence terminology

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/migrate-persistence-terminology.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Rewrite formal terminology
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_many(path, pairs):
              p = Path(path)
              s = p.read_text()
              original = s
              for old, new in pairs:
                  s = s.replace(old, new)
              if s != original:
                  p.write_text(s)

          # Chapter One: correct the first statement of the six formal patterns.
          replace_many('posts/001-meaning-is-not-everything.html', [
              ('An intelligibility can perform one of six basic kinds of work. The way that work becomes enough has three basic orientations. And what is realized through it can remain available in three basic ways.',
               'A completed intelligibility can realize one of six Transformation Patterns. The structural shape by which that transformation counts as complete is one of three Completion Topologies. And the achieved completion remains available through one of three Persistence Modes.'),
              ('Six by three by three. Fifty-four.', 'Six by three by three. Fifty-four.'),
              ('distinguish something, open something, relate something, correct something, integrate something or allow something to rest',
               'differentiate something, open something, relate something, repair something, integrate something or settle something'),
              ('what structural form has just been repaired', 'what Transformation Pattern has just been realized'),
          ])

          # Chapter Two: the question generated at the end is now the first primitive dimension.
          replace_many('posts/002-enough-is-a-shape.html', [
              ('what kind of work just became enough?', 'what Transformation Pattern just became complete?'),
              ('A particular kind of work answered that constraint.', 'A particular Transformation Pattern answered that constraint.'),
              ('What kind of work just became enough?', 'What Transformation Pattern just became complete?'),
              ('What was missing was not quantity. It was distinction.', 'What was missing was not quantity. A difference had not yet become determinate enough to matter.'),
              ('Enough arrives through relation.', 'Enough arrives through relating.'),
          ])

          # Chapter Three: rename the dimension and remove the old direction heuristic.
          replace_many('posts/003-enough-has-a-direction.html', [
              ('<title>Enough Has a Direction — Very Own Repo</title>', '<title>Enough Has a Topology — Very Own Repo</title>'),
              ('Chapter Three. The same kind of intelligible work can become enough toward a focus, across a field, or away through release.',
               'Chapter Three. The same Transformation Pattern can count as complete through a focal locus, a constitutive distribution, or release from prior governance.'),
              ('<h1>Enough Has a Direction</h1>', '<h1>Enough Has a Topology</h1>'),
              ('what kind of work just became enough?', 'what Transformation Pattern just became complete?'),
              ('We found six broad answers. Something can be distinguished, opened, related, repaired, integrated, or settled.',
               'We found six Transformation Patterns: Differentiation, Opening, Relating, Repair, Integration, and Settlement.'),
              ('But the kind of work is not yet the whole shape.', 'But the Transformation Pattern is not yet the whole shape.'),
              ('Take distinction again.', 'Take Differentiation again.'),
              ('Same family of work. Three very different ways for it to hold.', 'Same Transformation Pattern. Three different structural conditions by which it can count as complete.'),
              ('The completion has an orientation.', 'The completion has a topology.'),
              ('We can call the first orientation <strong>Toward</strong>.', 'We can call the first Completion Topology <strong>Focal</strong>.'),
              ('Toward names the way the completed intelligibility is organized: pressure is answered through a focus, source, pivot, point, or locally governing place.',
               'Focal means the transformation becomes complete because completion gathers around one privileged locus, and that locus is constitutive of why the transformation counts as complete.'),
              ('Toward does not mean small. It means focal.', 'Focal does not mean small. It means that one privileged locus is sufficient in the particular completion.'),
              ('Toward is about where the settlement takes its bearing, not how much meaning surrounds it.', 'Focal is about what makes the transformation sufficient, not how much meaning surrounds it.'),
              ('The second orientation is <strong>Across</strong>.', 'The second Completion Topology is <strong>Distributed</strong>.'),
              ('Across is what happens when the completion has to hold through a span, range, distribution, mutuality, or more-than-local field.',
               'Distributed means the transformation becomes complete only across a constitutive plurality, span, sequence, range, reciprocal field, set of cases, or system. No single locus is sufficient by itself.'),
              ('Across is easy to recognize in comparison.', 'Distributed completion is easy to recognize in comparison.'),
              ('Across makes coherence carry.', 'Distributed completion requires the plurality itself to be constitutive.'),
              ('Relation often makes Across especially visible.', 'Relating often makes Distributed topology especially visible.'),
              ('Across is where intelligibility has to remain alive between positions.', 'Distributed topology is where no single position is sufficient by itself.'),
              ('Across does not mean vague or everywhere.', 'Distributed does not mean vague or everywhere.'),
              ('Across is distributed constraint, not looseness.', 'Distributed is constitutive plurality, not looseness.'),
              ('The third orientation is <strong>Away</strong>.', 'The third Completion Topology is <strong>Release</strong>.'),
              ('Away is the one most likely to be mistaken for mere negation.', 'Release is the topology most likely to be mistaken for mere negation.'),
              ('Sometimes it is negative: “Not that one.” Sometimes exclusive: “Anything but Tuesday.” Sometimes liberating: “You can choose either route.” Sometimes releasing: “That condition no longer applies.”',
               'Its decisive feature is not negative wording. In Release, something that previously governed the situation loses its determining force: “That condition no longer applies.” “The old limit no longer decides the case.” “You are no longer bound to that route.”'),
              ('What these share is that completion comes through release from a governing bound, course, inclusion, or pressure.',
               'Release means de-governance: completion occurs because prior governance ceases to determine the result.'),
              ('Away can open rather than close.', 'Release can open rather than close.'),
              ('Away can be the shape of possibility.', 'Release can be the topology of newly available possibility.'),
              ('Away can also be the shape of correction.', 'Release can also be the topology of Repair.'),
              ('Away is structural release.', 'Release is structural de-governance.'),
              ('Toward, Across, and Away are not three moments in a little movie.', 'Focal, Distributed, and Release are not three moments in a little movie.'),
              ('They are three possible orientations of a completed grasp.', 'They are the three Completion Topologies of a completed grasp.'),
              ('They are coordinates inside intelligibility, not timestamps outside it.', 'They are structural constraints inside one completion-event, not timestamps outside it.'),
              ('What kind of work is being done?', 'What Transformation Pattern is being realized?'),
              ('And how is that work oriented when it becomes enough?', 'What structural condition makes that transformation count as complete?'),
              ('A distinction can be Toward, Across, or Away.', 'Differentiation can be Focal, Distributed, or Release.'),
              ('So can an opening. So can a relation. So can a repair. So can an integration. So can a settlement.', 'So can Opening, Relating, Repair, Integration, and Settlement.'),
              ('Six kinds of work. Three orientations. Eighteen broad locations.', 'Six Transformation Patterns. Three Completion Topologies. Eighteen broad locations.'),
              ('Family alone cannot tell you the full shape.', 'Transformation Pattern alone cannot tell you the full shape.'),
              ('Try the same thing with opening.', 'Try the same thing with Opening.'),
              ('Opening can gather, carry, or release.', 'Opening can complete through Focal, Distributed, or Release topology.'),
              ('Try relation.', 'Try Relating.'),
              ('Relation also changes character with orientation.', 'Relating also changes character with Completion Topology.'),
              ('Try repair.', 'Try Repair.'),
              ('The same broad family can answer pressure in three different geometries.', 'The same Transformation Pattern can become complete through three different topologies.'),
              ('Integration makes the difference even more concrete.', 'Integration makes the topological difference even more concrete.'),
              ('Wholeness can be focal, distributed, or released into balance.', 'Integration can be Focal, Distributed, or Release in topology.'),
              ('When something lands, ask first: what work just became enough?', 'When something lands, ask first: what Transformation Pattern just became complete?'),
              ('Then ask: where does the settlement take its shape?', 'Then ask: what structural condition makes that transformation sufficient?'),
              ('Does it gather toward a focus?', 'Does completion gather around one privileged locus: Focal?'),
              ('Does it hold across a field?', 'Does completion require a constitutive plurality or span: Distributed?'),
              ('Does it complete through release away from a governing bound?', 'Does completion occur because prior governance loses determining force: Release?'),
              ('Toward. Across. Away.', 'Focal. Distributed. Release.'),
              ('These are not proofs of Toward, Across, and Away.', 'These are not proofs of Focal, Distributed, and Release.'),
              ('focal landing, carried span, and release', 'focal completion, distributed completion, and release'),
              ('what work just became enough', 'what Transformation Pattern just became complete'),
          ])

          # Chapter Four: replace the old survivor vocabulary with Persistence Mode.
          replace_many('posts/004-what-survives-the-grasp.html', [
              ('A completed intelligibility can leave us with what is, what must remain with what follows, or what can now be done.',
               'A completed intelligibility can persist as Standing, Bearing, or Efficacy.'),
              ('Six kinds of work. Three orientations.', 'Six Transformation Patterns. Three Completion Topologies.'),
              ('The grasp has left something that <em>is</em>.', 'The achieved determination remains available as <em>Standing</em>.'),
              ('The grasp has left something that must remain <em>with</em>.', 'The achieved result remains through a constitutive <em>Bearing</em>.'),
              ('The grasp has left something that <em>does</em>.', 'The achieved result remains as <em>Efficacy</em>: an operative difference in what can happen.'),
              ('The first survivor mode is the simplest to feel.', 'The first Persistence Mode is the simplest to feel.'),
              ('We can call it <strong>Is</strong>.', 'We call it <strong>Standing</strong>.'),
              ('Is does not mean eternal truth.', 'Standing does not mean eternal truth.'),
              ('The survivor mode concerns what the completed grasp leaves standing now.', 'The Persistence Mode concerns how the achieved completion remains available.'),
              ('Nor does Is require a sentence containing the word “is.”', 'Nor does Standing require a sentence containing the word “is.”'),
              ('Is is what lets an intelligibility become a thing we can refer back to.', 'Standing is the achieved determination itself remaining available as the completed result.'),
              ('The second survivor mode is quieter because it often disappears into context.', 'The second Persistence Mode is quieter because it often disappears into context.'),
              ('We can call it <strong>With</strong>.', 'We call it <strong>Bearing</strong>.'),
              ('The intelligibility survives by accompanying.', 'The achieved result persists through a constitutive relation, dependency, contrast, condition, source, proportion, frame, support, or mutual determination.'),
              ('With is inherited bearing.', 'Bearing is constitutive dependence.'),
              ('With is not merely background information.', 'Bearing is not merely background information.'),
              ('What survives with the grasp continues to constrain it.', 'What persists as Bearing remains what it is through that constitutive relation.'),
              ('The third survivor mode is often the easiest to notice in practical life.', 'The third Persistence Mode is often the easiest to notice in practical life.'),
              ('We can call it <strong>Does</strong>.', 'We call it <strong>Efficacy</strong>.'),
              ('Does does not mean the sentence itself performs a physical action.', 'Efficacy does not mean the sentence itself performs a physical action.'),
              ('What survives is not motion. It is operability.', 'What persists is an accomplished capacity, operative effect, changed continuation, rule, function, or consequential difference in what can happen.'),
              ('That can leave a settled state: Is.', 'That can leave the achieved determination as Standing.'),
              ('That can leave a continuing bearing: With.', 'That can persist through Bearing.'),
              ('That can leave the next lawful move available: Does.', 'That can persist as Efficacy.'),
              ('An intelligibility does not have to become Is, then carry With, then become Does.', 'An intelligibility does not move from Standing to Bearing to Efficacy as a sequence.'),
              ('A completed grasp can leave any one of these modes as its governing survivor.', 'A completed grasp can persist in any one of these three modes.'),
              ('Standing, bearing and accomplishment are coordinates, not stages.', 'Standing, Bearing, and Efficacy are coordinates, not stages.'),
              ('same broad kind of work, with the same orientation', 'same Transformation Pattern, with the same Completion Topology'),
              ('The missing difference was not in the work.', 'The missing difference was not in the Transformation Pattern.'),
              ('It was not in Toward, Across or Away.', 'It was not in Focal, Distributed, or Release.'),
              ('It was in the mode of survival.', 'It was in the Persistence Mode.'),
              ('Take distinction Toward.', 'Take Differentiation × Focal.'),
              ('<strong>Is</strong>', '<strong>Standing</strong>'),
              ('<strong>With</strong>', '<strong>Bearing</strong>'),
              ('<strong>Does</strong>', '<strong>Efficacy</strong>'),
              ('Same work. Same orientation. Different survivor.', 'Same Transformation Pattern. Same Completion Topology. Different Persistence Mode.'),
              ('Take relation Across.', 'Take Relating × Distributed.'),
              ('Take repair Away.', 'Take Repair × Release.'),
              ('Even release has three ways to survive.', 'Release topology can persist as Standing, Bearing, or Efficacy.'),
              ('Each of the six kinds of work can complete Toward, Across or Away.', 'Each of the six Transformation Patterns can complete through Focal, Distributed, or Release topology.'),
              ('And each of those completed forms can leave its intelligibility available as Is, With or Does.', 'And each of those completed forms can persist as Standing, Bearing, or Efficacy.'),
              ('Six kinds of work.', 'Six Transformation Patterns.'),
              ('Three orientations.', 'Three Completion Topologies.'),
              ('Three survivor modes.', 'Three Persistence Modes.'),
              ('What work became enough?', 'What Transformation Pattern was realized?'),
              ('How did it hold?', 'What Completion Topology made it sufficient?'),
              ('What survived?', 'How does it persist?'),
              ('Distinction, Expansion, Relation, Correction, Integration, Rest.', 'Differentiation, Opening, Relating, Repair, Integration, Settlement.'),
              ('Toward, Across, Away.', 'Focal, Distributed, Release.'),
              ('Is, With, Does.', 'Standing, Bearing, Efficacy.'),
          ])

          # Chapter Five: use the current dimensions when describing recovery.
          replace_many('posts/005-enough-has-to-survive-contact.html', [
              ('What work became enough?', 'What Transformation Pattern was realized?'),
              ('How did it hold?', 'What Completion Topology made it sufficient?'),
              ('What survived?', 'How does the achieved completion persist?'),
              ('recover a determinate completed movement first, and only then recover a coordinate',
               'recover a determinate completed movement first, and only then recover its Transformation Pattern × Completion Topology × Persistence Mode coordinate'),
          ])

          # Working book: formal vocabulary only. This draft contains the explicit technical exposition.
          replace_many('WORKING.md', [
              ('six fundamental kinds of work', 'six Transformation Patterns'),
              ('three fundamental orientations', 'three Completion Topologies'),
              ('three fundamental ways', 'three Persistence Modes'),
              ('**Distinction × Toward × Is**', '**Differentiation × Focal × Standing**'),
              ('Distinction means something becomes distinct.', 'Differentiation means a previously unavailable or non-operative difference becomes determinate enough to matter.'),
              ('Toward means there is one privileged locus.', 'Focal means completion gathers around one privileged locus, and that locus is constitutive of sufficiency.'),
              ('Is means the determination stands.', 'Standing means the achieved determination itself remains available as the completed result.'),
              ('There is no completed Distinction sitting there waiting for Toward to select one of its results.', 'There is no completed Differentiation sitting there waiting for Focal to select one of its results.'),
              ('There is no Toward operation that occurs first and then gets preserved by Is.', 'There is no Focal operation that occurs first and then gets preserved by Standing.'),
              ('### Distinction', '### Differentiation'),
              ('### Expansion', '### Opening'),
              ('### Relation', '### Relating'),
              ('### Correction', '### Repair'),
              ('### Rest', '### Settlement'),
              ('### Toward', '### Focal'),
              ('### Across', '### Distributed'),
              ('### Away', '### Release'),
              ('### Is', '### Standing'),
              ('### With', '### Bearing'),
              ('### Does', '### Efficacy'),
              ('Distinction, Expansion, Relation, Correction, Integration, Rest', 'Differentiation, Opening, Relating, Repair, Integration, Settlement'),
              ('Toward, Across, Away', 'Focal, Distributed, Release'),
              ('Is, With, Does', 'Standing, Bearing, Efficacy'),
              ('Work / Orientation / Survivor', 'Transformation Pattern / Completion Topology / Persistence Mode'),
              ('work / orientation / survivor', 'Transformation Pattern / Completion Topology / Persistence Mode'),
          ])
          PY
      - name: Commit terminology migration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add posts/001-meaning-is-not-everything.html posts/002-enough-is-a-shape.html posts/003-enough-has-a-direction.html posts/004-what-survives-the-grasp.html posts/005-enough-has-to-survive-contact.html WORKING.md
          if git diff --cached --quiet; then
            echo 'No changes.'
            exit 0
          fi
          git commit -m 'Adopt canonical Persistence terminology throughout book'
          git push
