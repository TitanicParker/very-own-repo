name: Finalize Persistence book

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/finalize-persistence-book.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Tighten Release examples and remove legacy survivor wording
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p = Path('posts/003-enough-has-a-direction.html')
          s = p.read_text()
          pairs = [
            ('<p>And compare again: “Anyone except him.” The distinction completes by releasing the field away from one excluded case.</p>', '<p>And compare again: “Stop treating red and orange as the same category.” A rule that had flattened a difference loses its determining force, and the difference can now matter.</p>'),
            ('<p>“Anyone except him” has a release to it. The field is made workable by cutting away from something that had remained jointly admissible.</p>', '<p>“Stop treating red and orange as the same category” has Release topology because the prior conflating rule ceases to govern the distinction.</p>'),
            ('<p>“Anything except red.”</p>', '<p>“Stop treating red and orange as the same category.”</p>'),
            ('<p>All three make difference operative. But one gathers on a candidate, one carries discrimination across a field, and one completes through exclusion.</p>', '<p>All three make difference operative. But one gathers on a privileged candidate, one requires discrimination across a field, and one becomes complete because a prior rule that flattened the difference loses its determining force.</p>'),
            ('<p>“Beyond the fence, the land is open.” A closed edge gives way and the field releases past it.</p>', '<p>“The fence no longer marks the limit; the path continues beyond it.” A boundary that had governed availability loses its determining force.</p>'),
            ('<p>“Together they produce a pattern none of them has alone.” The relation releases into something emergent beyond the local pairings.</p>', '<p>“Do not treat these as separate signals anymore; together they form one rhythm.” Separation ceases to govern the relation, and an emergent coordination becomes constitutive.</p>'),
            ('Any one of them can characterize the way a particular piece of work becomes enough.', 'Any one of them can characterize the topology through which a particular Transformation Pattern becomes complete.'),
          ]
          for old, new in pairs:
              s = s.replace(old, new)
          p.write_text(s)

          p = Path('posts/004-what-survives-the-grasp.html')
          s = p.read_text()
          pairs = [
            ('Grammar can express the survivor without naming it.', 'Grammar can express a Persistence Mode without naming it.'),
            ('The third coordinate was already there.', 'The third dimension was already there.'),
            ('Relation can survive this way too.', 'A relation can persist this way too.'),
            ('Understanding is full of things that remain present by remaining with.', 'Understanding is full of achieved results that remain what they are through constitutive bearings.'),
            ('The grasp leaves an accomplishment, permission, capacity or next move available.', 'The achieved result remains as an accomplished capacity, operative effect, changed continuation, rule, function, or consequential difference in what can happen.'),
          ]
          for old, new in pairs:
              s = s.replace(old, new)
          p.write_text(s)
          PY
      - name: Commit final terminology pass
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add posts/003-enough-has-a-direction.html posts/004-what-survives-the-grasp.html
          git commit -m 'Tighten Persistence terminology and Release examples'
          git push
