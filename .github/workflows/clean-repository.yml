name: Clean repository

on:
  push:
    paths:
      - '.github/workflows/clean-repository.yml'

permissions:
  contents: write

jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Reduce repository to the committed book
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          # One appendix: canonical definitions plus the canonical 54.
          appendix = Path('APPENDIX.md').read_text()
          table_source = Path('CANONICAL_54.md').read_text()
          body_start = appendix.index('## The three primitive dimensions')
          body = appendix[body_start:].strip()
          table_start = table_source.index('| Cell | Coordinate |')
          table = table_source[table_start:].strip()
          Path('APPENDIX.md').write_text(
              '# Appendix — The Primitive Grammar\n\n'
              'The system rests on fifteen primitive definitions: three dimensions and the twelve values that can occupy them. '
              'Those values combine as `6 × 3 × 3` to generate the 54 forms.\n\n'
              + body
              + '\n\n---\n\n# The 54\n\n'
              'Each row gives the coordinate, its coordinate-generated form, the canonical crystallization, and its companion utterance.\n\n'
              + table + '\n'
          )

          # Rename the research material in the language the book now uses.
          corpus = Path('CANONICAL_CORPUS.md').read_text()
          first_field = corpus.index('# Corpus I —')
          material = corpus[first_field:]
          material = material.replace('# Corpus I —', '# Field I —').replace('# Corpus II —', '# Field II —')
          Path('TESTING_FIELD.md').write_text(
              '# Testing Field\n\n'
              'This file contains the two complete bodies of material used to test the grammar against language that was not written for it. '
              'Source order and exact sentence wording are preserved.\n\n'
              '## Contents\n\n'
              '- **27 fairy tales — 1,883 sentences**, in narrative order. Source sentence numbers are retained.\n'
              '- **615 mathematical traversals**, in source order. Each traversal preserves its opening claim and the ordered sentences by which the claim is reached.\n\n'
              '---\n\n' + material
          )

          # The reader route ends at the present living edge: Chapter Six.
          marker = Path('assets/reader-marker.js')
          s = marker.read_text()
          replacement = """const knownNext = {
            '001-meaning-is-not-everything.html': '002-enough-is-a-shape.html',
            '002-enough-is-a-shape.html': '003-the-whole-world-in-a-doorway.html',
            '003-the-whole-world-in-a-doorway.html': '004-the-whole-field.html',
            '004-the-whole-field.html': '005-the-testing-field.html',
            '005-the-testing-field.html': '006-completion-makes-continuation-possible.html'
          };"""
          s, count = re.subn(r"const knownNext = \{.*?\n  \};", replacement, s, count=1, flags=re.S)
          if count != 1:
              raise SystemExit('Could not rewrite knownNext')
          marker.write_text(s)

          # Chapter Four now hands directly into the testing field, not superseded chapters.
          p = Path('posts/004-the-whole-field.html')
          s = p.read_text()
          old = '<p>First we will slow down and examine Completion Topology properly. Then Persistence Mode. Then the field has to survive contact with sentences that were never written for it.</p>'
          new = '<p>First we open the testing field: fairy tales and mathematical traversals that were never written for the fifty-four. Then we watch completion make continuation possible under narrative and mathematical pressure.</p>'
          if old in s:
              s = s.replace(old, new)
          p.write_text(s)

          Path('README.md').write_text('''# Very Own Repo

The live repository for the book.

## Reading order

0. [Introduction](index.html)
1. [Meaning Is Not Everything](posts/001-meaning-is-not-everything.html)
2. [Enough Is a Shape](posts/002-enough-is-a-shape.html)
3. [The Whole World in a Doorway](posts/003-the-whole-world-in-a-doorway.html)
4. [The Whole Field](posts/004-the-whole-field.html)
5. [The Testing Field](posts/005-the-testing-field.html)
6. [Completion Makes Continuation Possible](posts/006-completion-makes-continuation-possible.html)

## Reference

- [Appendix — The Primitive Grammar](APPENDIX.md)
- [Testing Field](TESTING_FIELD.md) — 27 fairy tales and 615 mathematical traversals.

The public reader begins at `index.html`. `book.html` is the table of contents. The current reading sequence ends at Chapter Six.
''')

          Path('book.html').write_text('''<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#090b0a">
<title>The Book — Very Own Repo</title>
<meta name="description" content="The current book: introduction through Chapter Six, with the primitive grammar appendix and testing field.">
<style>
:root{--bg:#090b0a;--bg2:#0d100e;--ink:#f0f3f1;--body:#c9cfcb;--muted:#7f8983;--line:rgba(220,230,223,.14);--green:#91efb9;--red:#c96b76;--wide:760px}*{box-sizing:border-box}html{background:var(--bg);color:var(--body)}body{margin:0;min-height:100vh;background:radial-gradient(72rem 46rem at 8% -12%,rgba(145,239,185,.055),transparent 58%),radial-gradient(46rem 32rem at 105% 16%,rgba(201,107,118,.035),transparent 64%),linear-gradient(180deg,var(--bg2),var(--bg) 42rem);font-family:Georgia,'Times New Roman',serif}.wrap{width:min(calc(100% - 2.5rem),var(--wide));margin:auto;padding:4.5rem 0 7rem}.top{display:flex;justify-content:space-between;gap:1rem;margin-bottom:4.5rem;font:500 .7rem/1.3 system-ui,sans-serif;letter-spacing:.08em;text-transform:uppercase}.top a{color:var(--muted);text-decoration:none}.top a:hover{color:var(--green)}h1{margin:0 0 1.2rem;color:var(--ink);font-size:clamp(3.2rem,10vw,5.6rem);line-height:.94;font-weight:400;letter-spacing:-.05em}.lede{margin:0 0 3.5rem;max-width:650px;font-size:clamp(1.15rem,2.8vw,1.38rem);line-height:1.55}.chapter{display:grid;grid-template-columns:3rem 1fr;gap:1rem;padding:1.2rem 0;border-top:1px solid var(--line);text-decoration:none}.chapter:last-of-type{border-bottom:1px solid var(--line)}.number{color:var(--green);font:600 .72rem/1.5 system-ui,sans-serif;letter-spacing:.08em}.title{color:var(--ink);font-size:clamp(1.25rem,3vw,1.55rem);line-height:1.25}.chapter:hover .title{color:var(--green)}.reference{margin-top:3rem;padding-top:1rem}.reference p{margin:.65rem 0;font-size:1rem;line-height:1.5}.reference a{color:var(--body);text-decoration:none;border-bottom:1px solid var(--line)}.reference a:hover{color:var(--green)}.quiet{color:var(--muted)}@media(max-width:600px){.wrap{padding-top:3.7rem}.chapter{grid-template-columns:2.3rem 1fr}.top{margin-bottom:3.5rem}}
</style>
</head>
<body>
<main class="wrap">
<nav class="top"><a href="index.html">Beginning</a><span>Current book</span></nav>
<h1>The book so far.</h1>
<p class="lede">The introduction and first six chapters are the committed reading path. Chapter Six is the present living edge.</p>
<a class="chapter" href="index.html"><span class="number">00</span><span class="title">Introduction</span></a>
<a class="chapter" href="posts/001-meaning-is-not-everything.html"><span class="number">01</span><span class="title">Meaning Is Not Everything</span></a>
<a class="chapter" href="posts/002-enough-is-a-shape.html"><span class="number">02</span><span class="title">Enough Is a Shape</span></a>
<a class="chapter" href="posts/003-the-whole-world-in-a-doorway.html"><span class="number">03</span><span class="title">The Whole World in a Doorway</span></a>
<a class="chapter" href="posts/004-the-whole-field.html"><span class="number">04</span><span class="title">The Whole Field</span></a>
<a class="chapter" href="posts/005-the-testing-field.html"><span class="number">05</span><span class="title">The Testing Field</span></a>
<a class="chapter" href="posts/006-completion-makes-continuation-possible.html"><span class="number">06</span><span class="title">Completion Makes Continuation Possible</span></a>
<section class="reference"><p class="quiet">Reference</p><p><a href="APPENDIX.md">Appendix — The Primitive Grammar</a></p><p><a href="TESTING_FIELD.md">Testing Field — 27 fairy tales + 615 mathematical traversals</a></p></section>
</main>
</body>
</html>
''')
          PY

          rm -f \
            CANONICAL_54.md \
            CANONICAL_CORPUS.md \
            WORKING.md \
            READER_JOURNEY.md \
            SPREAD_PROTOCOL.md \
            posts/003-enough-has-a-direction.html \
            posts/004-what-survives-the-grasp.html \
            posts/005-enough-has-to-survive-contact.html

      - name: Validate the reduced book
        run: |
          test -f index.html
          test -f book.html
          test -f APPENDIX.md
          test -f TESTING_FIELD.md
          test -f posts/001-meaning-is-not-everything.html
          test -f posts/002-enough-is-a-shape.html
          test -f posts/003-the-whole-world-in-a-doorway.html
          test -f posts/004-the-whole-field.html
          test -f posts/005-the-testing-field.html
          test -f posts/006-completion-makes-continuation-possible.html
          test ! -e WORKING.md
          test ! -e CANONICAL_54.md
          test ! -e CANONICAL_CORPUS.md
          test ! -e posts/003-enough-has-a-direction.html
          test ! -e posts/004-what-survives-the-grasp.html
          test ! -e posts/005-enough-has-to-survive-contact.html
          if grep -R -n -E '003-enough-has-a-direction|004-what-survives-the-grasp|005-enough-has-to-survive-contact|WORKING\.md|CANONICAL_CORPUS\.md|CANONICAL_54\.md' README.md book.html assets posts index.html APPENDIX.md TESTING_FIELD.md; then
            echo 'Stale reference found'
            exit 1
          fi

      - name: Commit clean repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- ':!.github/workflows'
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Reduce repository to committed book"
          git push origin main
