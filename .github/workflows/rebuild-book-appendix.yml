          p.write_text(head + appendix + '\n')
          PY
      - name: Commit rebuilt appendix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add WORKING.md
          git commit -m 'Rebuild appendix from canonical Persistence grammar'
          git push
