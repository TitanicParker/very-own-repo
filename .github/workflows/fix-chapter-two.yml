name: Fix Chapter Two directly

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-chapter-two.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Replace Chapter Two local navigation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('posts/002-enough-is-a-shape.html')
          s = p.read_text()
          old = '''const deck=document.getElementById('deck');
          const progress=document.getElementById('progress');
          const cue=document.getElementById('cue');
          const slides=[...document.querySelectorAll('.gulp')];
          let index=0;
          function updateIndex(){const next=Math.round(deck.scrollLeft/deck.clientWidth);index=Math.max(0,Math.min(slides.length-1,next));progress.innerHTML=`<span class="live">${index+1}</span>`;cue.textContent=index===slides.length-1?'Chapter complete':'Swipe for more'}
          updateIndex();
          deck.addEventListener('scroll',()=>requestAnimationFrame(updateIndex),{passive:true});
          document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key==='PageDown'||e.key===' '){e.preventDefault();deck.scrollTo({left:Math.min(slides.length-1,index+1)*deck.clientWidth,behavior:'smooth'})}if(e.key==='ArrowLeft'||e.key==='PageUp'){e.preventDefault();deck.scrollTo({left:Math.max(0,index-1)*deck.clientWidth,behavior:'smooth'})}});'''
          new = '''const deck=document.getElementById('deck');
          const progress=document.getElementById('progress');
          const cue=document.getElementById('cue');
          const slides=[...document.querySelectorAll('.gulp')];
          const chapterThree='003-enough-has-a-direction.html';
          let index=0;
          let touchStartX=null,touchStartY=null;
          function updateIndex(){const next=Math.round(deck.scrollLeft/deck.clientWidth);index=Math.max(0,Math.min(slides.length-1,next));progress.innerHTML=`<span class="live">${index+1}</span> / ${slides.length}`;cue.textContent=index===slides.length-1?'Continue':'Swipe for more'}
          function advance(){if(index===slides.length-1){window.location.href=chapterThree;return}deck.scrollTo({left:(index+1)*deck.clientWidth,behavior:'smooth'})}
          updateIndex();
          deck.addEventListener('scroll',()=>requestAnimationFrame(updateIndex),{passive:true});
          deck.addEventListener('touchstart',e=>{const t=e.changedTouches[0];touchStartX=t.clientX;touchStartY=t.clientY},{passive:true});
          deck.addEventListener('touchend',e=>{if(touchStartX===null)return;const t=e.changedTouches[0];const dx=t.clientX-touchStartX,dy=t.clientY-touchStartY;if(index===slides.length-1&&dx<-46&&Math.abs(dx)>Math.abs(dy)*1.15){window.location.href=chapterThree}touchStartX=touchStartY=null},{passive:true});
          deck.addEventListener('wheel',e=>{if(index===slides.length-1&&Math.max(e.deltaX,e.deltaY)>35){window.location.href=chapterThree}},{passive:true});
          cue.style.pointerEvents='auto';
          cue.addEventListener('click',()=>{if(index===slides.length-1)window.location.href=chapterThree});
          document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key==='PageDown'||e.key===' '){e.preventDefault();advance()}if(e.key==='ArrowLeft'||e.key==='PageUp'){e.preventDefault();deck.scrollTo({left:Math.max(0,index-1)*deck.clientWidth,behavior:'smooth'})}});'''
          if old not in s:
              raise SystemExit('Expected Chapter Two navigation block not found')
          s = s.replace(old, new, 1)
          s = s.replace('../assets/reader-marker.js"></script>', '../assets/reader-marker.js?v=20260903b"></script>', 1)
          p.write_text(s)
          PY
      - name: Commit fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add posts/002-enough-is-a-shape.html
          git commit -m 'Fix Chapter Two counter and continuation'
          git push
