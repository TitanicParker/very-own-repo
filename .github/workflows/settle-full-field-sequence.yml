name: Settle full field sequence

on:
  push:
    paths:
      - '.github/workflows/settle-full-field-sequence.yml'

permissions:
  contents: write

jobs:
  settle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Align chapter sequence and openings
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('posts/003-the-whole-world-in-a-doorway.html')
          s = p.read_text()
          s = s.replace('Next, we slow down and look carefully at the topology of completion.', 'Next, we let the whole field appear.')
          p.write_text(s)

          p = Path('posts/003-enough-has-a-direction.html')
          s = p.read_text()
          s = s.replace('Chapter Four.', 'Chapter Five.')
          s = s.replace('aria-label="Chapter Four"', 'aria-label="Chapter Five"')
          s = s.replace('<p class="eyebrow">Chapter Four</p>', '<p class="eyebrow">Chapter Five</p>')
          s = s.replace('<a href="003-the-whole-world-in-a-doorway.html">Chapter Three</a>', '<a href="004-the-whole-field.html">Chapter Four</a>')
          old = '<p>By the end of Chapter Two, one question had started to sharpen: what Transformation Pattern just became complete?</p>\n<p>We found six Transformation Patterns: Differentiation, Opening, Relating, Repair, Integration, and Settlement.</p>\n<p class="emphasis">But the Transformation Pattern is not yet the whole shape.</p>'
          new = '<p>You have already seen the whole field.</p>\n<p>All fifty-four forms are available now. Nothing in this chapter enlarges that world.</p>\n<p class="emphasis">We are slowing down to see what Completion Topology is really doing inside it.</p>'
          s = s.replace(old, new)
          p.write_text(s)

          p = Path('posts/004-what-survives-the-grasp.html')
          s = p.read_text()
          s = s.replace('Chapter Five.', 'Chapter Six.')
          s = s.replace('aria-label="Chapter Five"', 'aria-label="Chapter Six"')
          s = s.replace('<p class="eyebrow">Chapter Five</p>', '<p class="eyebrow">Chapter Six</p>')
          s = s.replace('<a href="003-enough-has-a-direction.html">Chapter Four</a>', '<a href="003-enough-has-a-direction.html">Chapter Five</a>')
          old = '<p>Chapter Three ended with eighteen broad locations already available to us.</p>\n<p>Six Transformation Patterns. Three Completion Topologies.</p>\n<p class="emphasis">But a completed intelligibility does not merely stop. It leaves something available.</p>'
          new = '<p>You have already seen Standing, Bearing, and Efficacy across the full fifty-four.</p>\n<p>The map is complete. What remains is to feel why these three Persistence Modes are genuinely different.</p>\n<p class="emphasis">A completed intelligibility does not merely stop. It remains available in a particular way.</p>'
          s = s.replace(old, new)
          p.write_text(s)

          p = Path('posts/005-enough-has-to-survive-contact.html')
          s = p.read_text()
          s = s.replace('Chapter Six.', 'Chapter Seven.')
          s = s.replace('aria-label="Chapter Six"', 'aria-label="Chapter Seven"')
          s = s.replace('<p class="eyebrow">Chapter Six</p>', '<p class="eyebrow">Chapter Seven</p>')
          s = s.replace('<a href="004-what-survives-the-grasp.html">Chapter Five</a>', '<a href="004-what-survives-the-grasp.html">Chapter Six</a>')
          p.write_text(s)
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add posts/003-the-whole-world-in-a-doorway.html posts/003-enough-has-a-direction.html posts/004-what-survives-the-grasp.html posts/005-enough-has-to-survive-contact.html
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Make the full field the book's fourth chapter"
          git push origin main
