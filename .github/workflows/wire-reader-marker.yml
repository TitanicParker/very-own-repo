name: Wire reader marker

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/wire-reader-marker.yml'

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Add shared marker script to Chapters 1-3
        shell: bash
        run: |
          set -euo pipefail
          for f in \
            posts/001-meaning-is-not-everything.html \
            posts/002-enough-is-a-shape.html \
            posts/003-enough-has-a-direction.html
          do
            if ! grep -q 'assets/reader-marker.js' "$f"; then
              python3 - "$f" <<'PY'
import pathlib, sys
p = pathlib.Path(sys.argv[1])
s = p.read_text()
needle = '</body>'
insert = '<script src="../assets/reader-marker.js"></script>\n</body>'
if needle not in s:
    raise SystemExit(f'missing </body> in {p}')
p.write_text(s.replace(needle, insert, 1))
PY
            fi
          done
      - name: Commit wired chapters
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- posts/001-meaning-is-not-everything.html posts/002-enough-is-a-shape.html posts/003-enough-has-a-direction.html; then
            echo 'Nothing to change.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add posts/001-meaning-is-not-everything.html posts/002-enough-is-a-shape.html posts/003-enough-has-a-direction.html
          git commit -m 'Wire reader marker into Chapters 1-3'
          git push
