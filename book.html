<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Working Book — Very Own Repo</title>
<meta name="description" content="The current working book, rendered directly from WORKING.md.">
<style>
:root{--paper:#fbfaf7;--ink:#191919;--muted:#67645e;--rule:#d9d5cc;--accent:#2f5d50;--wide:820px}*{box-sizing:border-box}html{scroll-behavior:smooth;background:var(--paper);color:var(--ink)}body{margin:0;font-family:Georgia,'Times New Roman',serif;font-size:19px;line-height:1.75}.wrap{width:min(calc(100% - 2rem),var(--wide));margin:auto;padding:2rem 0 7rem}.top{display:flex;justify-content:space-between;align-items:center;gap:1rem;flex-wrap:wrap;padding:1rem 0 2rem;border-bottom:1px solid var(--rule);margin-bottom:3rem;font:700 .78rem/1.4 system-ui,sans-serif}.top a{color:var(--ink);text-decoration:none}.top a:hover{text-decoration:underline;text-underline-offset:4px}.source{color:var(--muted)}article h1{font-size:clamp(2.6rem,7vw,4.5rem);line-height:1;letter-spacing:-.04em;margin:4.5rem 0 1.4rem}article h1:first-child{margin-top:0}article h2{font-size:2rem;line-height:1.12;letter-spacing:-.025em;margin:3.6rem 0 1rem}article h3{font-size:1.3rem;margin:2.3rem 0 .7rem}article p{margin:0 0 1.35rem}article ul{margin:0 0 1.5rem;padding-left:1.4rem}article blockquote{margin:2rem 0;padding:.2rem 0 .2rem 1.2rem;border-left:3px solid var(--accent);color:#45413c}article code{font-size:.88em;background:#efede7;padding:.1rem .25rem;border-radius:4px}article pre{overflow:auto;padding:1rem;background:#efede7;border-radius:10px}article table{width:100%;border-collapse:collapse;margin:1.7rem 0 2.5rem;font-size:.88rem;line-height:1.45}article th,article td{border:1px solid var(--rule);padding:.7rem;vertical-align:top}article th{text-align:left;background:#f1eee7}article hr{border:0;border-top:1px solid var(--rule);margin:4rem 0}.loading{font-family:system-ui,sans-serif;color:var(--muted)}.error{font-family:system-ui,sans-serif;padding:1rem;border:1px solid var(--rule)}@media(max-width:650px){body{font-size:17px}.wrap{padding-top:.8rem}article table{display:block;overflow-x:auto;white-space:normal}}
</style>
</head>
<body>
<div class="wrap">
<nav class="top"><a href="./">← Blog index</a><span class="source">Rendered live from <a href="https://github.com/TitanicParker/very-own-repo/blob/main/WORKING.md">WORKING.md</a></span></nav>
<article id="book"><p class="loading">Opening the current working book…</p></article>
</div>
<script type="module">
const host=document.getElementById('book');
const slug=s=>s.toLowerCase().normalize('NFKD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
try{
  const [{marked},purifyModule]=await Promise.all([
    import('https://cdn.jsdelivr.net/npm/marked@15.0.7/+esm'),
    import('https://cdn.jsdelivr.net/npm/dompurify@3.2.4/+esm')
  ]);
  const DOMPurify=purifyModule.default;
  const response=await fetch('./WORKING.md',{cache:'no-store'});
  if(!response.ok)throw new Error('WORKING.md could not be loaded.');
  const markdown=await response.text();
  host.innerHTML=DOMPurify.sanitize(marked.parse(markdown));
  host.querySelectorAll('h1,h2,h3,h4').forEach(h=>{if(!h.id)h.id=slug(h.textContent)});
  if(location.hash){const target=document.getElementById(decodeURIComponent(location.hash.slice(1)));if(target)target.scrollIntoView();}
}catch(error){
  host.innerHTML='<div class="error"><strong>The working book could not be rendered.</strong><br><a href="WORKING.md">Open WORKING.md directly</a>.</div>';
}
</script>
</body>
</html>
